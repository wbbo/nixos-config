# SOPS 创建规则 —— encrypt 使用的 age 公钥
# 本项目用 SSH 主机密钥 (host key) 派生 age 密钥, sops-nix 部署时自动解密 (无 keys.txt)。
# 接收者: 用自己主机的 `ssh-to-age -i /etc/ssh/ssh_host_ed25519_key.pub` 生成并替换下方公钥

creation_rules:
  - path_regex: secrets/secrets\.yaml$
    age:
      - age12wxr8medgg97ala9r6wnsauast8v7x6l29jcvcgk6hrv7vfzzdsqhtrytf
