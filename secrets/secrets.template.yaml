# GitHub token: https://github.com/settings/tokens 生成 (classic, 勾选 public_repo)
# 只需填一次用户名 + token: systemd github-netrc 服务据此生成三条目 netrc
# (api.github.com 认证 API / github.com archive 入口 / codeload.github.com 实际下载,
#  netrc 协议需三个独立 machine, 缺任一都会限流)。
# 勿用 netrc 的 default 行 (会把 token 发给所有主机, 含 substituter/镜像)。
# 密码哈希:    mkpasswd -m yescrypt 生成
# cc-switch S3: Cloudflare R2 云同步凭据 (由 cc-switch.nix 激活钩子自动应用)
github-username: "<你的GitHub用户名>"
github-token: "<你的GitHub Personal Access Token>"

# user password
main-user-password-hash: "<mkpasswd -m yescrypt 生成的哈希>"

# cc-switch s3 configuration
cc-switch-s3-access-key-id: "<Cloudflare R2 Access Key ID>"
cc-switch-s3-secret-access-key: "<Cloudflare R2 Secret Access Key>"
cc-switch-s3-bucket: "<R2 Bucket 名, 如 xxx>"
cc-switch-s3-endpoint: "https://<R2 账户ID>.r2.cloudflarestorage.com"

# mihomo 订阅 URL (代理节点, 由 mihomo.nix 激活脚本注入 config.yaml)
mihomo-subscription-url: "https://<机场订阅链接>"
# mihomo API secret (WebUI/外部控制认证)
mihomo-api-secret: "<API 密钥>"
