# =====================================================================
# secrets 明文模板 —— cp 为 secrets.yaml 后由 sops 加密, 全部字段必填
# (首装流程见 README「场景一 · 第 3 步」; 已装好的系统编辑见「场景二」)
# 约定: 字符串值一律双引号包裹
# =====================================================================

# --- 登录密码 ---------------------------------------------------------
# 存【明文】(sops 加密保护即可, 无需自行预生成哈希):
#   激活时钩子自动 mkpasswd -m yescrypt 派生哈希注入 /etc/shadow,
#   每次 rebuild 强制应用 —— 手动 passwd 改的会被覆盖, 要改密码改这里。
# 注意勿填哈希: 该明文同时复用作 mihomo WebUI/API 的认证 secret。
main-user-password: "<你的登录密码>"

# --- GitHub 凭据 (nix flake update 认证) ------------------------------
# token: https://github.com/settings/tokens 生成 (classic, 勾选 public_repo)
# 只需填一次用户名 + token: systemd github-netrc 服务据此生成三条目 netrc
# (api.github.com 认证 API / github.com archive 入口 / codeload.github.com 实际下载,
#  netrc 协议需三个独立 machine 条目, 缺任一都会限流)。
# 勿添加 default 行 (会把 token 发给所有主机, 含 substituter/镜像)。
# token 过期表现: nix flake update 报 401/403 (日常 rebuild 不受影响),
# 到 [GitHub tokens](https://github.com/settings/tokens) 重签一个替换本字段即可。
github-username: "<你的GitHub用户名>"
github-token: "<ghp_ 开头的 Personal Access Token>"

# --- git 提交身份 -------------------------------------------------------
# 写入 ~/.config/git/identity (激活钩子生成, programs.git.includes 引用);
# 分发模板不含个人身份, 接收者填自己的。email 建议 GitHub noreply 地址
# (Settings → Emails, 归属账号且不暴露真实邮箱)。
git-user-name: "<你的提交署名>"
git-user-email: "<你的提交邮箱, 如 12345678+user@users.noreply.github.com>"

# --- SSH 用户密钥 (id_ed25519) -----------------------------------------
# 激活钩子再生 ~/.ssh/id_ed25519{,.pub}: 重装/换机一份 secrets 恢复全部身份
# (git 推拉 GitHub / ssh 跳板)。权威源语义: 手动生成的密钥会被激活覆盖,
# 换密钥 = 更新这里。私钥为多行 PEM, 用 YAML 块标量 (|) 原样粘贴全文。
ssh-id-ed25519: |
  -----BEGIN OPENSSH PRIVATE KEY-----
  <粘贴私钥全文, 保持缩进与原文件一致>
  -----END OPENSSH PRIVATE KEY-----
ssh-id-ed25519-pub: "ssh-ed25519 AAAA... <注释>"

# --- cc-switch 云同步 (Cloudflare R2) ---------------------------------
# R2 控制台创建 Bucket + 生成 API Token 后填写;
# cc-switch.nix 激活钩子会在每次 switch 时自动 config s3 set 应用。
cc-switch-s3-access-key-id: "<Cloudflare R2 Access Key ID>"
cc-switch-s3-secret-access-key: "<Cloudflare R2 Secret Access Key>"
cc-switch-s3-bucket: "<R2 Bucket 名, 如 xxx>"
cc-switch-s3-endpoint: "https://<账户ID>.r2.cloudflarestorage.com"

# --- mihomo 订阅 ------------------------------------------------------
# YAML 块标量每行一条 URL, 按需增删;
# 每条各生成一个 proxy-provider: provider1/provider2/...
mihomo-subscription-url: |
  https://<机场订阅链接1>
  https://<机场订阅链接2>
