dns: {default-nameserver: ["system", "223.6.6.6", "1.1.1.1", "8.8.8.8", "2400:3200::1", "2001:4860:4860::8888"], direct-nameserver: [], direct-nameserver-follow-policy: false, enable: true, enhanced-mode: "fake-ip", fake-ip-filter: ["*.lan", "*.local", "*.arpa", "time.*.com", "ntp.*.com", "time.*.com", "+.market.xiaomi.com", "localhost.ptlogin2.qq.com", "*.msftncsi.com", "www.msftconnecttest.com"], fake-ip-filter-mode: "blacklist", fake-ip-range: "198.18.0.1/16", fallback: [], fallback-filter: {domain: ["+.google.com", "+.facebook.com", "+.youtube.com"], geoip: true, geoip-code: "CN", ipcidr: ["240.0.0.0/4", "0.0.0.0/32"]}, ipv6: true, listen: ":53", nameserver: ["8.8.8.8", "https://doh.pub/dns-query", "https://dns.alidns.com/dns-query"], prefer-h3: true, proxy-server-nameserver: ["https://doh.pub/dns-query", "https://dns.alidns.com/dns-query", "tls://223.5.5.5"], respect-rules: false, use-hosts: true, use-system-hosts: true}
mode: rule
mixed-port: 7897
allow-lan: true
log-level: silent
ipv6: true
external-controller: "127.0.0.1:9097" # 控制 API 只绑本机回环 (allow-lan 下代理端口仍对外)
external-ui: ./ui # 本地托管 WebUI (metacubexd/yacd/zashboard, 经 BindPaths 进服务)
secret: "$API_SECRET" # API 密钥, 由 activationScripts 用 sops 注入
unified-delay: true
profile: {store-selected: true}
