# tun.route-exclude-address: 网络层排除(目标地址)不经 TUN 接管 —— 内网/直连段硬直连,
# 不依赖 RULE-SET 加载; 入站到这些网段的流量同样直通 (修复 docker 端口外部访问黑洞)。
# 分发接收者按自身内网段调整: 上游代理网段 / 本机所在网段 / 私有网段
tun: {auto-redirect: true, auto-detect-interface: true, auto-route: true, device: "Mihomo", dns-hijack: ["any:53"], mtu: 1500, route-exclude-address: ["10.65.4.0/23", "10.65.64.0/20", "192.168.0.0/16", "172.16.0.0/12", "127.0.0.0/8"], stack: "mixed", strict-route: false, enable: true}
proxies:
# 订阅: provider1/provider2/... 由 activationScripts 按订阅 URL 列表动态生成
proxy-providers:
$PROVIDERS
# 策略组
proxy-groups: [{name: PROXY, exclude-filter: "(?i)^(.*(?:🏷|邀请|加入|限国外使用|港|距离下次重置|一元\\.com|yiyuanjichang\\.com|20倍|流量)).*", type: fallback, url: "http://www.gstatic.com/generate_204", expected-status: 204, interval: 120, timeout: 5000, lazy: false, include-all: true, filter: "(?i)^(.*(?:)).*"}]
rules:
  # =============== 本地/调试/管理域名（最高优先级）===============
  - DOMAIN-SUFFIX,nsfocus.com,DIRECT
  ## 代理 server 直连
  ### 自建
  - DOMAIN-SUFFIX,112021.xyz,DIRECT
  - DOMAIN-SUFFIX,wbb.us.kg,DIRECT
  - DOMAIN-SUFFIX,wbo.dpdns.org,DIRECT
  ### 良心云
  - DOMAIN-SUFFIX,lxy1015.top,DIRECT
  - DOMAIN-SUFFIX,liangxin1.xyz,DIRECT
  - IP-CIDR,62.164.143.251/32,DIRECT,no-resolve
  - IP-CIDR,203.10.97.121/32,DIRECT,no-resolve

  # =============== 特定 IP 直连（你的内网）=======================
  - IP-CIDR,10.65.4.0/23,DIRECT,no-resolve   # 上游 socks 网段
  - IP-CIDR,10.65.64.0/20,DIRECT,no-resolve  # 本机/155 网段
  - IP-CIDR,206.119.160.196/32,DIRECT,no-resolve
  - IP-CIDR,107.173.146.206/32,DIRECT,no-resolve
  
  # =============== 特定进程直连（游戏/办公/安全软件）==============
  - PROCESS-NAME,MpDefenderCoreService.exe,DIRECT
  - PROCESS-NAME,GTA5_Enhanced.exe,DIRECT
  - PROCESS-NAME,FiveM.exe,DIRECT
  - PROCESS-NAME,Launcher.exe,DIRECT
  - PROCESS-NAME,Wow.exe,DIRECT
  - PROCESS-NAME,vcsc.exe,DIRECT
  - PROCESS-NAME,Battle.net.exe,DIRECT
  - PROCESS-NAME,ToDesk.exe,DIRECT
  - PROCESS-NAME,WXWork.exe,DIRECT
  - PROCESS-NAME,SunloginClient.exe,DIRECT
  - PROCESS-NAME,AweSun.exe,DIRECT
  - PROCESS-NAME,WeLink.exe,DIRECT
  - PROCESS-NAME,NsfocusVPN.exe,DIRECT
  - PROCESS-NAME,nsvpn.exe,DIRECT
  - PROCESS-NAME,vpn_service.exe,DIRECT
  # =============== 关键业务域名直连 =============================
  - DOMAIN-KEYWORD,baidu,DIRECT
  - DOMAIN-KEYWORD,deepseek,DIRECT
  - DOMAIN-KEYWORD,mihoyo,DIRECT
  - DOMAIN-KEYWORD,nsfocus,DIRECT
  - DOMAIN-KEYWORD,bilibili,DIRECT
  - DOMAIN,live.vhall.com,DIRECT
  - DOMAIN,douyin.com,DIRECT
  - DOMAIN,zhihu.com,DIRECT
  - DOMAIN,yxt.com,DIRECT
  - DOMAIN-KEYWORD,yunxuetang,DIRECT
  - DOMAIN,api.ejiasu.net,DIRECT
  - DOMAIN-KEYWORD,microsoft,DIRECT
  # ===============         google        ========================
  - DOMAIN-KEYWORD,google,PROXY
  - DOMAIN-SUFFIX,gstatic.com,PROXY
  # =============== 特殊代理需求（极少数）========================
  - IP-CIDR,100.21.243.232/32,PROXY,no-resolve
  - PROCESS-NAME,DarkSoulsII.exe,PROXY
  - DOMAIN-KEYWORD,github,PROXY
  # =============== 规则集（按优先级排序）========================
  - RULE-SET,reject,REJECT # 广告/跟踪 域名
  - RULE-SET,private,DIRECT # ← 替代 GEOIP,private，更全面
  - RULE-SET,lancidr,DIRECT # 局域网 IP
  - RULE-SET,cncidr,DIRECT # 中国 IP
  - RULE-SET,icloud,DIRECT
  - RULE-SET,apple,DIRECT
  - RULE-SET,direct,DIRECT # 明确直连的域名
  - RULE-SET,applications,DIRECT # 应用类直连（如 Steam）
  - RULE-SET,google,PROXY # Google 全家桶
  - RULE-SET,proxy,PROXY # 明确需代理的域名
  - RULE-SET,telegramcidr,PROXY # Telegram IP
  - MATCH,PROXY # 其他全部走代理
# 规则集段由 activationScripts 按 mihomo.nix 的规则集清单生成 (envsubst 占位,
# 规律: 本模板内任何带 $ 的变量文字都会被替换, 注释想提变量名必须去掉 $):
# mihomo 的 rule-provider url 只支持单 string (不支持数组 fallback, 已实测 -t 拒绝),
# 单域名 CDN 挂 + 本地缓存空会导致对应 RULE-SET 静默不存在、规则落空直落
# MATCH,PROXY (LAN DIRECT 失效/全量进代理)。兜底靠激活期预拉 (三 CDN 轮流)
# 铺满 /persist/var/lib/mihomo/ruleset 缓存, 之后 interval 内断网不影响已缓存规则。
rule-providers:
$RULE_PROVIDERS
# dns.listen ":53" (全接口): 本机 + 路由器/旁路由场景 —— LAN 设备把 DNS 指向
# 本机 53 即拿 fake-ip (配套: 设备网关也指本机, 流量经 TUN 分流, 见 mihomo.nix
# 的 ip_forward/防火墙)。回环与 virbr0/ens33 地址同端口共存 (不同地址不冲突);
# 前提: 系统不得有其他通配 53 占用 (systemd-resolved stub=127.0.0.53 会冲突,
# 本仓库用 NM 直管 resolv.conf 无 resolved, 安全)。
dns: {listen: ":53", default-nameserver: ["223.6.6.6", "1.1.1.1", "8.8.8.8", "2400:3200::1", "2001:4860:4860::8888"], direct-nameserver: [], direct-nameserver-follow-policy: false, enable: true, enhanced-mode: "fake-ip", fake-ip-filter: ["*.lan", "*.local", "*.arpa", "time.*.com", "ntp.*.com", "time.*.com", "+.market.xiaomi.com", "localhost.ptlogin2.qq.com", "*.msftncsi.com", "www.msftconnecttest.com"], fake-ip-filter-mode: "blacklist", fake-ip-range: "198.18.0.1/16", ipv6: true, nameserver: ["https://doh.pub/dns-query", "https://dns.alidns.com/dns-query"], prefer-h3: true, proxy-server-nameserver: ["https://doh.pub/dns-query", "https://dns.alidns.com/dns-query", "tls://223.5.5.5"], respect-rules: false, use-hosts: true, use-system-hosts: true}
mode: rule
mixed-port: 7890
allow-lan: true
log-level: silent
ipv6: true
external-controller: "127.0.0.1:9090" # 控制 API 只绑本机回环 (空 host = 0.0.0.0 暴露 LAN; allow-lan 下代理端口仍对外)
external-ui: ./ui # 本地托管 WebUI (metacubexd/yacd/zashboard, 经 BindPaths 进服务)
secret: "$API_SECRET" # API 密钥, 由 activationScripts 用 sops 注入
unified-delay: true
profile: {store-selected: true}
